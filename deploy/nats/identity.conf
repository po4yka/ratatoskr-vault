# Merge this public-nkey identity into the host NATS `authorization.users` list; the deployed ACL
# is `deploy/nats/ratatoskr.conf` in ratatoskr-platform and this stanza is a byte-equal copy of its
# VAULT entry (XR-021 CONTRACTS.md section S03). The seed stays in `/etc/ratatoskr/vault.nkey`,
# named by `RATATOSKR__BUS__NKEY_SEED_PATH`; replace only the non-secret public-key placeholder.
#
# Vault consumes the Edge-provisioned durable `ratatoskr_vault_backup_policy` (commands stream) and
# publishes exactly one subject: its acknowledgement of a policy version. A denied publish is
# visible only in the NATS server log as a `Publish Violation`; the client sees a missing PubAck.
{
    nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_VAULT_XXXXXXXX
    permissions: {
        publish: {
            allow: [
                "evt.vault.backup_policy.acknowledged.v1",
                "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_vault_backup_policy",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_vault_backup_policy",
                "$JS.ACK.ratatoskr_commands.ratatoskr_vault_backup_policy.>",
            ]
        }
        subscribe: { allow: ["_INBOX.>"] }
    }
}
