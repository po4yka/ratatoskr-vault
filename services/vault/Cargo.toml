[package]
name        = "ratatoskr-vault"
description = "The Ratatoskr Vault deployable: durable backup and restore for Git repositories."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "ratatoskr-vault"
path = "src/main.rs"

[dependencies]
ratatoskr-vault-core.workspace     = true
ratatoskr-vault-blobstore.workspace = true
ratatoskr-vault-gitrunner.workspace = true
ratatoskr-vault-http.workspace     = true
ratatoskr-vault-persistence.workspace = true
ratatoskr-vault-telemetry.workspace = true
tokio.workspace                    = true
tracing.workspace                  = true
uuid.workspace                     = true
serde_json.workspace               = true
thiserror.workspace                = true

[dev-dependencies]
axum.workspace = true
ratatoskr-vault-persistence = { workspace = true, features = ["test-support"] }
secrecy.workspace = true
sqlx.workspace              = true
url.workspace = true

[lints]
workspace = true
