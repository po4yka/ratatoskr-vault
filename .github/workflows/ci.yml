# The gate DEVELOPMENT.md documents, enforced. The command list here and the command list in
# DEVELOPMENT.md are the same list; if they drift, DEVELOPMENT.md is wrong.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# SECURITY.md: deny by default. The gate reads the tree and needs nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On a pull request the newest push is the only one whose answer matters, and cancelling the
  # superseded run is what makes the queue keep up. On `main` it is the opposite: a cancelled run
  # leaves that commit with no verdict at all, and `main` is the branch whose history is supposed
  # to record whether each commit passed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The integration suite talks to a real PostgreSQL on purpose: the persistence layer uses
    # runtime-checked queries, so this suite is what verifies them. Without it the tests do not
    # run and the schema is unverified.
    services:
      postgres:
        # Pinned by digest, not by tag. This digest is `postgres:17` as it stood on 2026-08-19
        # (PostgreSQL 17.11), byte-identical to ratatoskr-platform/ci.yml so one pull serves both.
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault
          # Byte-identical to compose.yaml. Without it this cluster is created with the runner's
          # glibc collation while a developer's is created with ICU, so a text index sorts
          # differently in the two places that are supposed to be checking each other.
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault -d vault"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30

    env:
      # Where the suite creates and drops its disposable databases. Matches compose.yaml, so the
      # same command works on a laptop and here.
      VAULT_TEST_DATABASE_URL: postgres://vault:vault@127.0.0.1:5432/vault

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate reads the tree and pushes nothing, so the checkout credential is left behind
          # in .git/config for no reason. Deny by default applies to the token too.
          persist-credentials: false

      - name: Show the pinned toolchain
        run: rustup show           # rust-toolchain.toml is the only supported toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo fetch --locked

      # Reads RustSec, the licence set, duplicate versions and the source policy. Nothing else in
      # the gate looks at any of them.
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-deny
      - run: cargo deny check

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The one size limit clippy cannot express. clippy.toml bounds a function, a signature and
      # a block; no Rust lint counts the lines in a file. The number is the fleet ratchet from
      # ratatoskr-workspace/docs/QUALITY_GATES.md, not a target. `*.rs` only, so Cargo.lock and
      # schema.sql need no exclusion list — an exclusion list is a second source of truth that
      # goes stale in silence.
      - run: git ls-files -z "*.rs" | xargs -0 -r wc -l | awk '$2 != "total" && $1 > 850 { print; bad = 1 } END { exit bad }'

      # Before the tests: services/vault/tests/boot.rs executes the ratatoskr-vault binary as a
      # child process, and `cargo test` builds only the package under test's own artifacts on a
      # clean checkout. The boot test asserts the built path exists and tells the developer what
      # to run; this step is what makes that always true in CI.
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked --release

      # This file and DEVELOPMENT.md are one list by rule, and the rule had no enforcement — the
      # same defect class as a document claiming a capability the tree lacks. It passes today, so
      # it starts as a guard rather than as a backlog item.
      #
      # The awk is scoped to the `gate` job. Reading the whole file was a latent trap: this file
      # documents THIS job's command list, so the first commit adding a second job with a cargo
      # step would have failed the guard pointing at the wrong file. A top-level job key is a bare
      # name at two spaces, which is what the first rule tracks.
      - name: The gate and DEVELOPMENT.md are one list
        run: |
          set -euo pipefail
          in_ci=$(awk '
            /^  [a-z][a-z0-9_-]*:[[:space:]]*$/ { in_gate = ($0 ~ /^  gate:[[:space:]]*$/) }
            in_gate && /^[[:space:]]+- run: cargo / { sub(/^[[:space:]]+- run: /, ""); print }
          ' .github/workflows/ci.yml)
          in_doc=$(awk '/^### Rust — also the CI gate/{f=1} f&&/^cargo /{print} f&&/^```$/{exit}' \
                   DEVELOPMENT.md)
          if [ "$in_ci" != "$in_doc" ]; then
            echo "::error::ci.yml and DEVELOPMENT.md have drifted. DEVELOPMENT.md is the one that is wrong."
            diff <(echo "$in_ci") <(echo "$in_doc") || true
            exit 1
          fi
          echo "the two lists are identical:"
          echo "$in_ci" | awk '{print "  " $0}'
